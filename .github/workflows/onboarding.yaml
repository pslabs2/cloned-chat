name: Onboarding

# Manually adds this app to the infra repo's Argo CD app-of-apps.
# Later runs are no-ops; the infra repo is the source of truth
# after onboarding.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Generate and validate the files, but don't push
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          SHA: ${{ github.sha }}
        run: echo "tag=sha-${SHA::7}" >> "$GITHUB_OUTPUT"

  onboard:
    needs: image-tag
    uses: pslabs2/workflows/.github/workflows/onboard-app.yaml@main
    permissions:
      contents: read
      packages: read
    with:
      image-tag: ${{ needs.image-tag.outputs.tag }}
      ingress-host: ${{ github.event.repository.name }}.pukarsubedi.com
      dry-run: ${{ inputs.dry-run }}
      app-client-id: ${{ vars.INFRA_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
      infra-token: ${{ secrets.INFRA_TOKEN }}
